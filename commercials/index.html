<script>
  document.querySelectorAll('.reel').forEach((reel) => {
    const video = reel.querySelector('video');
    const button = reel.querySelector('.reel-fullscreen');
    const error = reel.querySelector('.reel-error');
    if (!video.requestFullscreen && !video.webkitEnterFullscreen) return;
    button.hidden = false;
    button.addEventListener('click', async () => {
      error.textContent = '';
      try {
        if (video.requestFullscreen) {
          await video.requestFullscreen();
        } else {
          video.webkitEnterFullscreen();
        }
      } catch (err) {
        console.error('Unable to open video fullscreen:', err);
        error.textContent = 'Could not open fullscreen. Try the fullscreen control on the video.';
      }
    });
  });
</script>
