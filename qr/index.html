<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR sheet — Dottie Labs</title>
<meta name="description" content="Printable QR codes for Dottie Labs projects.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-192.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="theme-color" content="#FBFAF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="sheet-tools">
  <a href="../">← Back to dottielabs.com</a>
  <button type="button" onclick="window.print()">Print (letter)</button>
</div>
<main class="sheet">
  <header class="sheet-head">
    <img src="../assets/dottie-labs-logo-lockup-transparent.png" alt="Dottie Labs">
    <span>dottielabs.com</span>
  </header>
  <ul class="qr-grid">
    <li><img src="../assets/qr/get-recd-lv.svg" alt="QR code for getrecdlv.com"><strong>Get Rec’d LV</strong><small>getrecdlv.com</small></li>
    <li><img src="../assets/qr/say-it-with-a-bloom.svg" alt="QR code for sayitwithabloom.com"><strong>Say It With A Bloom</strong><small>sayitwithabloom.com</small></li>
    <li><img src="../assets/qr/just-in-case-im-dead.svg" alt="QR code for justincaseimdead.com"><strong>Just In Case I'm Dead</strong><small>justincaseimdead.com</small></li>
    <li><img src="../assets/qr/young-roth-club.svg" alt="QR code for youngrothclub.com"><strong>Young Roth Club</strong><small>youngrothclub.com</small></li>
    <li><img src="../assets/qr/readingtheroom4u.svg" alt="QR code for getrecdlv.com/food"><strong>ReadingTheRoom4U</strong><small>getrecdlv.com/food</small></li>
    <li><img src="../assets/qr/p1meetsp2.svg" alt="QR code for p1meetsp2.com"><strong>P1meetsP2</strong><small>p1meetsp2.com</small></li>
  </ul>
</main>
</body>
</html>
